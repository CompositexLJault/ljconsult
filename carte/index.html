<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loïc Jault — Contact</title>
<meta name="description" content="Ajoutez Loïc Jault à vos contacts — Conseil industriel indépendant.">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  @font-face{
    font-family:"Inter";
    src:url("../fonts/inter-var.woff2") format("woff2-variations"), url("../fonts/inter-var.woff2") format("woff2");
    font-weight:100 900; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:"Inter";
    src:url("../fonts/inter-italic-var.woff2") format("woff2-variations"), url("../fonts/inter-italic-var.woff2") format("woff2");
    font-weight:100 900; font-style:italic; font-display:swap;
  }
  @font-face{
    font-family:"IBM Plex Mono";
    src:url("../fonts/ibm-plex-mono-400.woff2") format("woff2");
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:"IBM Plex Mono";
    src:url("../fonts/ibm-plex-mono-500.woff2") format("woff2");
    font-weight:500; font-style:normal; font-display:swap;
  }
  :root{
    --ink:#12161a; --ink-soft:#474b50; --ink-faint:#6b737b;
    --paper:#f6f7f5; --surface:#ffffff; --surface-2:#e9ebe7; --line:#dbdfda;
    --steel:#2e4756; --accent:#b8451b; --accent-2:#2e4756; --accent-ink:#ffffff;
    --ease: cubic-bezier(.16,1,.3,1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f1f3f0; --ink-soft:#c5cbc6; --ink-faint:#8a9089;
      --paper:#0a0c0d; --surface:#141718; --surface-2:#1a1e1f; --line:#2a2f30;
      --steel:#7fa0b0; --accent:#e0703a; --accent-2:#7fa0b0; --accent-ink:#1a0d04;
    }
  }
  :root[data-theme="dark"]{
    --ink:#f1f3f0; --ink-soft:#c5cbc6; --ink-faint:#8a9089;
    --paper:#0a0c0d; --surface:#141718; --surface-2:#1a1e1f; --line:#2a2f30;
    --steel:#7fa0b0; --accent:#e0703a; --accent-2:#7fa0b0; --accent-ink:#1a0d04;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Inter", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .card{
    width:100%; max-width:380px; background:var(--surface);
    border:1px solid var(--line); border-radius:24px;
    padding:40px 32px 32px; text-align:center;
    box-shadow:0 20px 60px -30px rgba(0,0,0,.25);
  }
  .avatar{
    width:96px; height:96px; border-radius:50%; object-fit:cover;
    margin:0 auto 20px; display:block;
    box-shadow:0 4px 16px rgba(0,0,0,.18); border:3px solid var(--surface);
  }
  h1{ font-size:1.5rem; font-weight:800; letter-spacing:-0.02em; margin:0 0 4px; }
  .title{ font-size:0.98rem; color:var(--ink-soft); margin:0 0 6px; }
  .tagline{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:0.68rem; font-weight:500; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--accent); margin:0 0 28px;
  }
  .btn-add{
    display:block; width:100%; padding:16px 20px; border-radius:14px;
    background:var(--accent); color:var(--accent-ink); text-decoration:none;
    font-weight:600; font-size:1.02rem; letter-spacing:-0.01em;
    transition:transform .2s var(--ease), box-shadow .2s ease;
  }
  .btn-add:hover{ transform:translateY(-2px); box-shadow:0 10px 24px -12px rgba(184,69,27,.5); }
  .links{
    display:flex; flex-direction:column; gap:10px;
    margin-top:20px; padding-top:20px; border-top:1px solid var(--line);
  }
  .links a{
    color:var(--ink-soft); text-decoration:none; font-size:0.92rem;
    padding:10px; border-radius:10px; transition:background .2s ease, color .2s ease;
  }
  .links a:hover{ background:var(--surface-2); color:var(--ink); }
  .back{
    display:inline-block; margin-top:24px; font-size:0.82rem;
    color:var(--ink-faint); text-decoration:none;
  }
  .back:hover{ color:var(--accent); }
</style>
</head>
<body>

  <div class="card">
    <img class="avatar" src="../avatar.webp" alt="Portrait de Loïc Jault" width="96" height="96">
    <h1>Loïc Jault</h1>
    <p class="title">Conseil industriel indépendant</p>
    <p class="tagline">Outils métier &amp; performance industrielle</p>

    <a class="btn-add" href="../contact.vcf" download="Loic-Jault.vcf">+ Ajouter à mes contacts</a>

    <div class="links">
      <a href="tel:+33618880042">06 18 88 00 42</a>
      <a href="mailto:loic@jault-conseil.fr">loic@jault-conseil.fr</a>
    </div>

    <a class="back" href="../">Voir le site complet →</a>
  </div>

</body>
</html>
